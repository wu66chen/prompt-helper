<svg class="launcher-icon" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="ph-logo-tile" x1="50" y1="0" x2="200" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--logo-tile-top, #edf0f3)"/>
      <stop offset="1" stop-color="var(--logo-tile-bottom, #cdd3da)"/>
    </linearGradient>
    <linearGradient id="ph-logo-front" x1="49" y1="70" x2="211" y2="145" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--logo-front-light, #8baac1)"/>
      <stop offset=".48" stop-color="var(--logo-front-mid, #6b8eaa)"/>
      <stop offset="1" stop-color="var(--logo-front-dark, #4d708e)"/>
    </linearGradient>
    <linearGradient id="ph-logo-return" x1="108" y1="142" x2="151" y2="223" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--logo-fold-dark, #29455a)"/>
      <stop offset=".46" stop-color="var(--logo-fold-mid, #587d99)"/>
      <stop offset="1" stop-color="var(--logo-fold-light, #91aec4)"/>
    </linearGradient>
    <linearGradient id="ph-logo-rim" x1="90" y1="0" x2="150" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--logo-rim-light, #ffffff)" stop-opacity=".8"/>
      <stop offset=".45" stop-color="var(--logo-rim-light, #ffffff)" stop-opacity=".05"/>
      <stop offset="1" stop-color="var(--logo-rim-dark, #8493a3)" stop-opacity=".22"/>
    </linearGradient>
    <filter id="ph-logo-shadow" x="-30%" y="-20%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="var(--logo-shadow, #263747)" flood-opacity=".2"/>
    </filter>
  </defs>
  <path d="M72 1H184C235 1 255 21 255 72V184C255 235 235 255 184 255H72C21 255 1 235 1 184V72C1 21 21 1 72 1Z" fill="url(#ph-logo-tile)" stroke="url(#ph-logo-rim)" stroke-width="1.4"/>
  <g filter="url(#ph-logo-shadow)" stroke="none">
    <path d="M42 180C53 153 101 140 153 140C181 148 199 169 199 193V223C181 209 163 208 129 208H96C65 208 42 205 42 180Z" fill="url(#ph-logo-return)"/>
    <path d="M42 180V111C42 73 65 54 100 53C159 52 190 53 211 32V102C211 133 185 140 153 140C101 140 53 153 42 180Z" fill="url(#ph-logo-front)"/>
  </g>
  <path d="M42 180V111C42 73 65 54 100 53C159 52 190 53 211 32" fill="none" stroke="var(--logo-edge, #e1edf5)" stroke-opacity=".5" stroke-width=".85"/>
</svg>
